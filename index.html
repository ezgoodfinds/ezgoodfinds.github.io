<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EZ Good Finds | Tech Worth Discovering</title>

  <meta
    name="description"
    content="EZ Good Finds discovers useful, interesting and entertaining technology, products, features and ideas."
  />

  <!-- Pinterest domain verification -->
  <meta name="p:domain_verify" content="b97bba29cc26039344d484725dfc16b7"/>

  <style>
    :root {
      --bg: #050914;
      --bg2: #08111f;
      --panel: rgba(12, 22, 40, 0.78);

      --white: #f8fafc;
      --soft: #cbd5e1;
      --muted: #8091a8;

      --blue: #3b82f6;
      --blue2: #60a5fa;
      --cyan: #38bdf8;

      --border: rgba(96, 165, 250, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--white);

      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(37, 99, 235, 0.3),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(14, 165, 233, 0.13),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #050914 0%,
          #08111f 55%,
          #050914 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.02) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.02) 1px,
          transparent 1px
        );

      background-size: 44px 44px;
      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* NAV */

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 24px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;
      background: var(--blue2);

      box-shadow:
        0 0 10px rgba(96,165,250,.9),
        0 0 28px rgba(96,165,250,.45);
    }

    .nav-links {
      display: flex;
      gap: 22px;

      color: #94a3b8;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    /* HERO */

    .hero {
      min-height: 68vh;

      display: flex;
      align-items: center;

      padding: 80px 0 90px;
    }

    .hero-content {
      max-width: 820px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;

      padding: 8px 13px;
      margin-bottom: 24px;

      border:
        1px solid rgba(96,165,250,.28);

      border-radius: 999px;

      background:
        rgba(59,130,246,.07);

      color: #bfdbfe;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      max-width: 900px;

      font-size:
        clamp(52px, 8vw, 92px);

      line-height: .98;
      letter-spacing: -.06em;
      font-weight: 900;
    }

    .gradient {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          #dbeafe 50%,
          #60a5fa
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero p {
      max-width: 680px;

      margin: 28px 0 0;

      color: #94a3b8;

      font-size:
        clamp(17px, 2vw, 20px);

      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;

      margin-top: 34px;
    }

    .button {
      padding: 13px 18px;

      border-radius: 12px;

      font-size: 14px;
      font-weight: 750;

      transition: .2s ease;
    }

    .button-primary {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );

      box-shadow:
        0 10px 30px rgba(37,99,235,.22);
    }

    .button-primary:hover {
      transform: translateY(-2px);
    }

    .button-secondary {
      border:
        1px solid rgba(148,163,184,.16);

      background:
        rgba(15,23,42,.6);

      color: #cbd5e1;
    }

    /* CONTENT */

    .section {
      padding: 45px 0;
    }

    .section-title {
      margin-bottom: 22px;
    }

    .section-label {
      color: var(--blue2);

      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h2 {
      margin: 8px 0 0;

      font-size:
        clamp(28px, 4vw, 42px);

      letter-spacing: -.04em;
    }

    .cards {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;
    }

    .card {
      padding: 26px;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          rgba(15,27,49,.82),
          rgba(8,16,30,.82)
        );

      box-shadow:
        0 25px 70px rgba(0,0,0,.2);
    }

    .card h3 {
      margin: 0 0 10px;

      color: white;
      font-size: 18px;
    }

    .card p {
      margin: 0;

      color: #94a3b8;
      line-height: 1.65;
      font-size: 14px;
    }

    /* ABOUT */

    .about {
      margin: 60px 0;

      padding:
        clamp(30px, 6vw, 58px);

      border:
        1px solid var(--border);

      border-radius: 26px;

      background:
        linear-gradient(
          135deg,
          rgba(37,99,235,.08),
          rgba(15,23,42,.78)
        );
    }

    .about p {
      max-width: 760px;

      margin: 15px 0 0;

      color: #a8b5c7;
      line-height: 1.8;
    }

    /* FOOTER */

    footer {
      padding: 45px 0 55px;

      border-top:
        1px solid rgba(148,163,184,.08);

      color: #64748b;
      font-size: 13px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .footer-links a:hover {
      color: #cbd5e1;
    }

    @media (max-width: 760px) {

      .nav-links {
        display: none;
      }

      .hero {
        padding-top: 55px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

    <nav>

        <a href="#about">
          About

        <a href="privacy-policy.html">

        <a href="mailto:hometechez@gmail.com">

        </a>

      </div>

    </nav>


    <main>

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            Tech Discovery & Media
          </div>
